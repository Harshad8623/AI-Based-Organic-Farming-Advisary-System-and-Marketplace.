{% extends "base.html" %}
{% block title %}Register — KrishiAI{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-header bg-success text-white text-center py-3">
          <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i><span data-i18n="register_heading">Create Account</span></h4>
          <small data-i18n="register_subtitle">Join KrishiAI — it's free</small>
        </div>
        <div class="card-body p-4">

          <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Role Selection -->
            <div class="mb-3">
              <label class="form-label fw-semibold" data-i18n="register_role_label">I am a:</label>
              <div class="d-flex gap-4">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="role"
                         id="roleFarmer" value="farmer"
                         {{ 'checked' if selected_role != 'buyer' else '' }} />
                  <label class="form-check-label" for="roleFarmer" data-i18n="register_farmer">
                    🌾 Farmer
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="role"
                         id="roleBuyer" value="buyer"
                         {{ 'checked' if selected_role == 'buyer' else '' }} />
                  <label class="form-check-label" for="roleBuyer" data-i18n="register_buyer">
                    🛒 Buyer
                  </label>
                </div>
              </div>
            </div>

            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label" data-i18n="register_name_label">Full Name</label>
              <input type="text" class="form-control" id="name" name="name" maxlength="100" autocomplete="name" value="{{ request.form.get('name', '') }}"
                     data-i18n-placeholder="register_name_ph"
                     placeholder="Your full name" required />
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label" data-i18n="register_email_label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" maxlength="120" autocomplete="email" value="{{ request.form.get('email', '') }}"
                     placeholder="you@example.com" required />
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label" data-i18n="register_phone_label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" name="phone" maxlength="20" autocomplete="tel" value="{{ request.form.get('phone', '') }}"
                     data-i18n-placeholder="register_phone_ph"
                     placeholder="+91 XXXXXXXXXX" />
            </div>

            <!-- Location (always visible) -->
            <div class="mb-3">
              <label for="location" class="form-label" data-i18n="register_location_label">Location / Village</label>
              <input type="text" class="form-control" id="location" name="location" maxlength="200" value="{{ request.form.get('location', '') }}"
                     data-i18n-placeholder="register_location_ph"
                     placeholder="e.g. Pune, Maharashtra" />
            </div>

            <!-- Soil Type (farmer-only field) -->
            <div id="farmerFields">
              <div class="mb-3">
                <label for="soil_type" class="form-label">
                  <span data-i18n="register_soil_label">Soil Type</span>
                  <small class="text-muted" data-i18n="register_farmer">Farmer</small>
                </label>
                <select class="form-select" id="soil_type" name="soil_type">
                  <option value="" data-i18n="register_soil_ph">Select soil type</option>
                  <option value="Loamy" data-i18n="auth_soil_loamy" {{ 'selected' if request.form.get('soil_type') == 'Loamy' else '' }}>Loamy</option>
                  <option value="Clay" data-i18n="auth_soil_clay" {{ 'selected' if request.form.get('soil_type') == 'Clay' else '' }}>Clay</option>
                  <option value="Sandy" data-i18n="auth_soil_sandy" {{ 'selected' if request.form.get('soil_type') == 'Sandy' else '' }}>Sandy</option>
                  <option value="Silt" data-i18n="auth_soil_silt" {{ 'selected' if request.form.get('soil_type') == 'Silt' else '' }}>Silt</option>
                  <option value="Peat" data-i18n="auth_soil_peat" {{ 'selected' if request.form.get('soil_type') == 'Peat' else '' }}>Peat</option>
                  <option value="Chalky" data-i18n="auth_soil_chalky" {{ 'selected' if request.form.get('soil_type') == 'Chalky' else '' }}>Chalky</option>
                </select>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label" data-i18n="register_password_label">Password</label>
              <input type="password" class="form-control" id="password" name="password"
                     data-i18n-placeholder="register_password_ph"
                     placeholder="Min 8 characters" required minlength="8" maxlength="128" autocomplete="new-password" />
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label for="confirm_password" class="form-label" data-i18n="register_confirm_label">Confirm Password</label>
              <input type="password" class="form-control" id="confirm_password"
                     name="confirm_password" maxlength="128" autocomplete="new-password"
                     data-i18n-placeholder="register_confirm_ph"
                     placeholder="Repeat password" required />
            </div>

            <button type="submit" class="btn btn-success w-100">
              <i class="bi bi-check-circle me-1"></i><span data-i18n="register_btn">Create My Account</span>
            </button>
          </form>

          <hr />
          <p class="text-center mb-0">
            <span data-i18n="register_have_acct">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="text-success fw-semibold" data-i18n="register_log_in">Log In</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Show/hide farmer-only fields based on role selection
  const radios = document.querySelectorAll('input[name="role"]');
  const farmerFields = document.getElementById('farmerFields');

  function updateFarmerFields() {
    const selected = document.querySelector('input[name="role"]:checked');
    farmerFields.style.display = (selected && selected.value === 'farmer') ? 'block' : 'none';
  }

  radios.forEach(r => r.addEventListener('change', updateFarmerFields));
  // Set correct initial state on page load (handles validation failure case)
  updateFarmerFields();
</script>
{% endblock %}
