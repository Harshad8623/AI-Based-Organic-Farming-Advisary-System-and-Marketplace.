{% extends "base.html" %}
{% block title %}Login — KrishiAI{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="card shadow-sm">
        <div class="card-header bg-success text-white text-center py-3">
          <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="login_heading">Login</span></h4>
          <small data-i18n="login_welcome">Welcome back to KrishiAI</small>
        </div>
        <div class="card-body p-4">

          <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="next" value="{{ request.args.get('next', request.form.get('next', '')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="email" class="form-label" data-i18n="login_email_label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" maxlength="120" autocomplete="email" value="{{ request.form.get('email', '') }}"
                     data-i18n-placeholder="login_email_ph"
                     placeholder="you@example.com" required autofocus />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label" data-i18n="login_password_label">Password</label>
              <input type="password" class="form-control" id="password"
                     name="password" maxlength="128" autocomplete="current-password"
                     data-i18n-placeholder="login_password_ph"
                     placeholder="Your password" required />
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="remember" name="remember" />
              <label class="form-check-label" for="remember" data-i18n="login_remember">Remember me</label>
            </div>

            <button type="submit" class="btn btn-success w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i><span data-i18n="login_btn">Login</span>
            </button>
          </form>

          <hr />
          <p class="text-center mb-0">
            <span data-i18n="login_new">New here?</span>
            <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold" data-i18n="login_create_acct">Create Account</a>
          </p>
        </div>
      </div>


    </div>
  </div>
</div>
{% endblock %}
