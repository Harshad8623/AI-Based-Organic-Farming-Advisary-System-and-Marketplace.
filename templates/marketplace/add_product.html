{% extends "base.html" %}
{% block title %}Add Product — KrishiAI{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <h3 class="fw-bold text-success mb-4">
        <i class="bi bi-plus-circle me-2"></i><span data-i18n="add_product_heading">List a New Product</span>
      </h3>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('marketplace.add_product') }}"
                enctype="multipart/form-data" id="addProductForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="name" class="form-label fw-semibold" data-i18n="add_product_name_label">Product Name *</label>
              <input type="text" class="form-control" id="name" name="name" maxlength="100"
                     data-i18n-placeholder="add_product_name_ph"
                     placeholder="e.g. Organic Tomatoes" value="{{ request.form.get('name', '') }}" required />
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="price" class="form-label fw-semibold" data-i18n="add_product_price_label">Price (₹ per unit) *</label>
                <input type="number" class="form-control" id="price" name="price"
                       value="{{ request.form.get('price', '') }}" placeholder="e.g. 40" min="0.01" max="1000000" step="0.01" required />
              </div>
              <div class="col-md-6">
                <label for="quantity" class="form-label fw-semibold" data-i18n="add_product_qty_label">Available Quantity *</label>
                <input type="text" class="form-control" id="quantity" name="quantity" maxlength="50" aria-describedby="stock-help"
                       data-i18n-placeholder="add_product_qty_ph"
                       value="{{ request.form.get('quantity', '') }}" placeholder="e.g. 100 kg" required />
              </div>
            </div>

            <p id="stock-help" class="form-text" data-i18n="commerce_stock_help">Use a number and unit, such as 100 kg or 20 pieces. The price is for one of that unit. Orders use whole units.</p>
            <div class="mb-3">
              <label for="category" class="form-label fw-semibold" data-i18n="add_product_category_label">Category</label>
              <select class="form-select" id="category" name="category">
                <option value="" data-i18n="add_product_category_ph">Select category</option>
                {% for category in ['Vegetables','Fruits','Grains','Pulses','Spices','Dairy','Herbs','Seeds','Fertilizers','Other'] %}
                <option value="{{ category }}" {% if request.form.get('category') == category %}selected{% endif %} data-i18n="commerce_category_{{ category|lower }}">{{ category }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label fw-semibold" data-i18n="add_product_desc_label">Description</label>
              <textarea class="form-control" id="description" name="description" maxlength="3000"
                        rows="3" data-i18n-placeholder="add_product_desc_ph"
                        placeholder="Describe your product — growing method, freshness, etc.">{{ request.form.get('description', '') }}</textarea>
            </div>

            <div class="mb-3">
              <label for="image" class="form-label fw-semibold" data-i18n="add_product_image_label">Product Image</label>
              <input type="file" class="form-control" id="image" name="image"
                     accept="image/jpeg,image/png,image/webp" onchange="previewImage(event)" />
              <div id="imgPreview" class="mt-2" style="display:none">
                <img id="previewEl" src="#" alt="Product photo preview" class="img-thumbnail" style="max-height:150px;" />
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success" data-i18n="add_product_btn">
                <i class="bi bi-cloud-upload me-1"></i>Add Product
              </button>
              <a href="{{ url_for('marketplace.my_products') }}" class="btn btn-outline-secondary" data-i18n="add_product_cancel">
                Cancel
              </a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function previewImage(event) {
  const preview = document.getElementById('previewEl');
  const div     = document.getElementById('imgPreview');
  const file    = event.target.files[0];
  if (file) {
    preview.src   = URL.createObjectURL(file);
    div.style.display = 'block';
  }
}
</script>
{% endblock %}
